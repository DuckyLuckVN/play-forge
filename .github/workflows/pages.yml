name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The checks run side by side (each needs only its own install), so the slowest one sets the pace.
  checks:
    strategy:
      fail-fast: false
      matrix:
        task: [typecheck, lint, 'format:check', test]
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.task }}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the app version's patch number is the commit count (scripts/version.mjs).
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # The long simulation tests (balance gauges, whole bot matches, fairness runs; ~3.5 min) run beside
  # everything else and turn the run red when balance breaks, but the deploy doesn't wait for them.
  simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:sim

  # Separate from `build` so a stale README is flagged without blocking the deploy.
  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/readme.mjs
      - name: Check README games section is up to date
        run: git diff --exit-code README.md || (echo "::error::Run 'npm run readme' and commit README.md" && exit 1)

  deploy:
    # Only from main, once the build and the checks pass (the simulation tests report separately).
    if: github.event_name != 'pull_request'
    needs: [build, checks]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
