<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="A glass jar of goo monsters and a falling two-colour capsule">
  <rect width="320" height="200" rx="16" fill="#10132c"/>
  <g fill="#ffffff" opacity="0.08">
    <circle cx="60" cy="150" r="5"/><circle cx="74" cy="110" r="3"/><circle cx="248" cy="80" r="4"/><circle cx="262" cy="140" r="6"/><circle cx="40" cy="60" r="3"/><circle cx="286" cy="40" r="3"/>
  </g>
  <rect x="98" y="34" width="124" height="152" rx="18" fill="#4be3a0" opacity="0.08"/>
  <rect x="98" y="34" width="124" height="152" rx="18" fill="none" stroke="#343b7a" stroke-width="5"/>
  <rect x="106" y="44" width="7" height="110" rx="3.5" fill="#ffffff" opacity="0.08"/>
  <!-- falling capsule -->
  <g>
    <rect x="132" y="18" width="28" height="26" rx="13" fill="#c98f00"/>
    <rect x="132" y="18" width="28" height="23" rx="11.5" fill="#ffc83d"/>
