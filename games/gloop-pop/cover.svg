    <path d="M0-28 7-21 17-23 18-13 26-6 20 3 23 13 12 15 6 23-3 18-12 23-16 14-26 10-21 1-27-8-18-13-17-23-8-21Z" fill="#ff6b6b"/>
    <ellipse cx="-8" cy="-6" rx="6" ry="7" fill="#fff"/><ellipse cx="8" cy="-6" rx="6" ry="7" fill="#fff"/>
    <circle cx="-6" cy="-5" r="3.2" fill="#1d1440"/><circle cx="10" cy="-5" r="3.2" fill="#1d1440"/>
    <path d="M-15-16-4-12M15-16 4-12" stroke="#1d1440" stroke-width="2.6" stroke-linecap="round"/>
