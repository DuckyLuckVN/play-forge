<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Play Forge</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        background: #0e1116;
        color: #e8ebf0;
        font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      main { max-width: 760px; margin: 0 auto; padding: 56px 16px; }
      h1 { margin: 0; font-size: 34px; }
      .tagline { margin: 4px 0 32px; color: #8b93a1; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
      a.card {
        display: grid; gap: 6px; padding: 18px;
        border: 1px solid #2a303b; border-radius: 12px; background: #171b22;
        color: inherit; text-decoration: none;
      }
      a.card:hover { border-color: #7ee081; }
      .card h2 { margin: 0; font-size: 18px; }
      .card p { margin: 0; color: #8b93a1; font-size: 13px; }
      .card span { font-size: 12px; color: #7ee081; }
    </style>
  </head>
  <body>
    <main>
      <h1>Play Forge</h1>
      <p class="tagline">Mini-games you can play with friends, browser to browser.</p>
      <div class="grid" id="games"></div>
    </main>
    <script type="module">
      import games from './games/games.json'
      const grid = document.getElementById('games')
      for (const g of games) {
        const a = document.createElement('a')
        a.className = 'card'
        a.href = `games/${g.id}/index.html`
        const h2 = document.createElement('h2')
        h2.textContent = g.title
        const p = document.createElement('p')
        p.textContent = g.description
        const span = document.createElement('span')
        span.textContent = `${g.players} players`
        a.append(h2, p, span)
        grid.append(a)
      }
    </script>
  </body>
</html>
